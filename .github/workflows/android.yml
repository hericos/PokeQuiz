name: Android

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # publicar a Release com o APK

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Versão cresce a cada execução, para o Android aceitar a atualização.
      BUILD_NAME: 1.0.${{ github.run_number }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build APK
        run: >
          flutter build apk --release
          --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER

      - name: Renomeia o APK
        run: cp build/app/outputs/flutter-apk/app-release.apk pokequiz.apk

      # Download direto do .apk (sem zip) na página de Releases.
      - name: Publica a Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.BUILD_NAME }}
          name: PokeQuiz ${{ env.BUILD_NAME }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Build ${{ env.BUILD_NUMBER }} do commit ${{ github.sha }} (branch ${{ github.ref_name }}).
            Baixe o `pokequiz.apk` abaixo e instale por cima da versão anterior.
          files: pokequiz.apk
