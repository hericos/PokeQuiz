<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PokeQuiz: jogos e desafios do mundo Pokémon. App de fã, sem vínculo com Nintendo, Game Freak ou The Pokémon Company.">
  <meta name="theme-color" content="#C7405A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PokeQuiz">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PokeQuiz</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Tela de carregamento no mesmo tom do app, até o Flutter iniciar. */
    html, body { margin: 0; height: 100%; background: #E05A70; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      font-family: system-ui, sans-serif; color: #fff;
    }
    #loading img { width: 96px; height: 96px; border-radius: 22px; }
    #loading .bar { width: 120px; height: 4px; border-radius: 2px;
      background: rgba(255,255,255,.3); overflow: hidden; }
    #loading .bar::after { content: ""; display: block; width: 40%; height: 100%;
      background: #FFCB05; animation: slide 1s infinite ease-in-out; }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  </style>
</head>
<body>
  <div id="loading">
    <img src="icons/Icon-192.png" alt="">
    <strong>PokeQuiz</strong>
    <div class="bar"></div>
  </div>
  <script>
    // Remove a tela de carregamento quando o primeiro frame do Flutter aparece.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
